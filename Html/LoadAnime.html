<html>
    <head>
        <title>Animation4</title>
        <style>
            #main{
                width: 500px;
                height: 500px;
                border: 1px solid black;
                display: flex;
            }
            .c1{
                border: 1px solid black;
                width: 20px;
                height: 20px;
                border-radius: 100px;
                margin: 20px;
                margin-top: 150px;
                margin-left: 50px;
                background-color: steelblue;
                animation: A1;
                animation-duration: 1.5s;
                animation-iteration-count: infinite;
                animation-direction: alternate;
                animation-timing-function: ease-in-out;
            }
            @keyframes A1{
                from{
                    margin-top: 150px;
                }
                to{
                    margin-top: 180px;
                    
                    
                }
            }
            .c1:nth-child(2){
                animation-delay: 0.5s;
            }
            .c1:nth-child(3){
                animation-delay: 1s;
            }
        </style>
    </head>
    <body>
        <div id="main">
            <div class="c1"></div>
            <div class="c1"></div>
            <div class="c1"></div>
            
        </div>
    </body>
</html>
