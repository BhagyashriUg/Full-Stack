<html>
    <head>
        <title>TransformTag</title>
        <style>
            #i1{
                border: 1px solid black;
                transform: skewX(20deg);
                height: 200px;
                width: 200px;
                margin: 50px;
            }
            #i2{
                height: 200px;
                width: 200px;
                border: 1px solid black;
                transform: translateX(500px);
            }
            #i3{
                margin-left: 50px;
                height: 200px;
                width: 200px;
                border: 1px solid black;
                transform: rotate(40deg);
            }
            #i4{
                margin-bottom: 150px;
                margin-left: 50px;
                height: 200px;
                width: 200px;
                border: 1px solid black;
                transform: translateY(100px);
            }
            
            #i5{
                margin-left: 50px;
                height: 200px;
                width: 200px;
                border: 1px solid black;
                transform: rotate3d(1,0,-1,50deg);
            }
            #i6{
                margin-top: 30px;
                height: 200px;
                width: 200px;
                border: 1px solid black;
                transform: scaleX(2);
            }
            #i7{
                height: 200px;
                width: 200px;
                border: 1px solid black;
                transform: translate3d(500px,100px,200px);
            }
            #i8{
                height: 200px;
                width: 200px;
                border: 1px solid black;
                transform: scaleZ(2);
                
            }
        </style>
        
    </head>
    <body>
        <div id="i1"></div>
        <div id="i2"></div>
        <div id="i3"></div>
        <div id="i4"></div>
        <div id="i5"></div>
        <div id="i6"></div>
        <div id="i7"></div>
        <div id="i8"></div>
        
    </body>
</html>
