<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //for of -> directly prints the element in the array 
        console.log("For of : ");
        
        let fruits = ["Apple","Banana","Coconut","Dragon Fruit"];
        for(let fruit of fruits){
            console.log(fruit);
        }
        
        let Num = [1,2,3,4,5];
        for(let i of Num){
            console.log(i);
        }

        //for in -> prints the index of the elementf
        console.log("For In : ");
        let PrimeNum = [1,2,3,5,7,11];
        for(let i in PrimeNum){
            console.log(PrimeNum[i]);
        }
    </script>
</body>
</html>
