<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = prompt("Enter a Number : ");
        let result = 1;
        for (let index = 1; index <= a; index++) {
            result = result*index;
        }
        console.log("Factorial is : ",result);
    </script>
</body>
</html>
