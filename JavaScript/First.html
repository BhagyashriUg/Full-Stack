    <script>
        console.log("Hello World"); // to print on console inside inspect option
        // variables defined 
        // let a = 5;

        let a = prompt("Enter Number 1 : ");
        let b = prompt("Enter Number 2 : ");
        console.log("Addition is  : ",parseInt(a)+parseInt(b)); //cannot write a+b it performs Concatenation considering it as two different strings 
        //parseInt tells it an integer type variable
        console.log("Multiplication  is  : ",a*b);
        console.log("Substraction is  : ",a-b);
        console.log("Division is  : ",a/b);
        console.log("Modulo is : ",a%b);
       
    </script>
