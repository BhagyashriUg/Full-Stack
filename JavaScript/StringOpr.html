<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let word = "smiley";
        console.log("string length Function : ",word.length);
        console.log("Index of function : ",word.indexOf("e"));
        console.log("String trim : ",word.trim());//
        console.log("Uppercase : ",word.toUpperCase());
        console.log("Lowercase : ",word.toLowerCase());
        console.log("IndexOf : ",word.indexOf("i"));
        console.log("last Index of : ",word.lastIndexOf("y"));
        console.log("Includes : ",word.includes("ley"));
        console.log("Concatenation : ",word.concat("please"));//Not permanent
        console.log(word);

        console.log("EndsWith : ",word.endsWith("pt"));

        console.log("Replace : ",word.replace("e","i"));//Not permanent
        console.log(word);

        let str2 = "a-b-c";
        console.log("Replace all : ","a-b-c".replaceAll("a","x"));
        console.log("Repeat : ",word.repeat(3));
        console.log(word.slice(2));
        console.log("Split : ",word.split(","));//
        console.log("charAt : ",word.charAt(5));
        console.log("Start with : ",word.startsWith("sm"));

        let str = "hello";
        console.log(str.substring(1,4));
    </script>
</body>
</html>
