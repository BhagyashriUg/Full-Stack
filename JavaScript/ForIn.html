    <script>
        //FOR IN -> Used For Key Value Pairs
        let Data = {Fruit : "Apple",Color : "Violet", Animal : "Monkey", Plant : "Cactus"};
        for(let i in Data){
            console.log(i ,":", Data[i]);
        }
    </script>
