<html>
    <head>
        <title>Animation</title>
        <style>
            #main{
                border: 1px solid black;
                height: 500px;
                width: 500px;
                margin-left: 450px;
                text-align: center;
                box-shadow: 0px 0px 10px rgba(0,0,0,0.7);
                
                #i1{
                    font-weight: 100;
                }
                #i2{
                    text-shadow: 0px 0px 3px rgba(0,0,0,1);
                }
                #i3{
                    text-shadow: 6px 0px 0px rgba(0,0,0,0.2);
                }
                #i4{
                    text-shadow: 0px 2px 5px rgba(0,0,255);
                }
                
                #i5{
                    text-shadow:0px 0px 20px rgb(255,100,160);
                }
                #i6{
                    text-shadow: 4px 2px 2px rgb(0,0,0,0.5);
                }
                #i7{
                    color: white;
                    text-shadow: 0px 0px 20px rgba(255,40,40);
                }
            }
        </style>
    </head>
    <body>
        <div id="main">
            <h1 id="i1">Text Shadow</h1>
            <h1 id="i2">Text Shadow</h1>
            <h1 id="i3">Text Shadow</h1>
            <h1 id="i4">Text Shadow</h1>
            <h1 id="i5">Text Shadow</h1>
            <h1 id="i6">Text Shadow</h1>
            <h1 id="i7">Text Shadow</h1>
        </div>
    </body>
</html>
